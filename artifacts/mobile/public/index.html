<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050816" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlowLedger" />
    <meta name="description" content="Your money, clearly." />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style id="expo-reset">
      html,
      body {
        width: 100%;
        min-width: 0;
        height: 100%;
        background: #050816;
        overflow-x: hidden;
      }

      body {
        margin: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }

      #root {
        display: flex;
        width: 100%;
        max-width: 100vw;
        min-height: 100%;
        flex: 1;
        background: #050816;
        overflow-x: hidden;
      }

      #flowledger-web-startup-cover {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        background: #050816;
        color: #f8fafc;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      #flowledger-web-startup-cover[data-state="hidden"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 90ms ease-out, visibility 0s linear 90ms;
      }

      @media (prefers-reduced-motion: reduce) {
        #flowledger-web-startup-cover[data-state="hidden"] {
          transition: none;
        }
      }

      .flowledger-web-startup-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .flowledger-web-startup-logo {
        width: 200px;
        height: 200px;
        margin-bottom: 18px;
        border-radius: 48px;
        object-fit: contain;
        filter: drop-shadow(0 8px 18px rgba(56, 189, 248, 0.22));
      }

      .flowledger-web-startup-status {
        margin: 0;
        color: #f8fafc;
        font: 800 20px/1.2 Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      @media (max-width: 767px) {
        * {
          scrollbar-width: none;
        }

        *::-webkit-scrollbar {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div
      id="flowledger-web-startup-cover"
      data-state="visible"
      data-reason="initial"
      role="progressbar"
      aria-label="Loading your FlowLedger plan"
    >
      <div class="flowledger-web-startup-brand">
        <img
          class="flowledger-web-startup-logo"
          src="/icon-192.png"
          alt="FlowLedger"
          width="200"
          height="200"
        />
        <p class="flowledger-web-startup-status">Loading Plan...</p>
      </div>
    </div>
    <noscript>
      <style>#flowledger-web-startup-cover { display: none; }</style>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root" inert aria-hidden="true"></div>
    <script>
      (() => {
        const cover = document.getElementById("flowledger-web-startup-cover");
        const root = document.getElementById("root");
        if (!cover || !root) return;

        const arm = (reason) => {
          cover.dataset.state = "visible";
          cover.dataset.reason = reason;
          cover.removeAttribute("aria-hidden");
          root.setAttribute("inert", "");
          root.setAttribute("aria-hidden", "true");
          document.documentElement.removeAttribute("data-flowledger-ready");
        };

        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") arm("resume");
        }, true);
        window.addEventListener("pagehide", () => arm("resume"), true);
      })();
    </script>
  </body>
</html>
