name: Release checks

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:source-check
      - run: pnpm run check:mobile-config
      - run: pnpm run release:guide-check
      - run: pnpm run test
      - run: pnpm run typecheck
      - name: Export the production web bundle
        run: pnpm --filter @workspace/mobile exec expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-build-key
          EXPO_PUBLIC_APP_ENVIRONMENT: development
          EXPO_PUBLIC_LAUNCH_MODE: free
      - run: pnpm run release:artifact-check
      - run: pnpm exec expo-doctor artifacts/mobile
      - run: pnpm audit --prod --audit-level high
